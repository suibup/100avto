
name: Unzip website archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip archive
        run: |
          mkdir -p extracted
          unzip -o 100avto-site.zip -d extracted

          shopt -s dotglob
          cp -a extracted/* .
          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract website archive" || echo "Nothing to commit"
          git push
          
